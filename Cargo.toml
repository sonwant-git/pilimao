[workspace]
resolver = "2"
members = [
    "crates/pilimao-dsp",
    "crates/pilimao-decoder",
    "crates/pilimao-metadata",
    "crates/pilimao-playlist",
    "crates/pilimao-skin-wsz",
    "crates/pilimao-audio-engine",
    "crates/pilimao-win32-shell",
    "crates/pilimao-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/sonwant-git/pilimao"

[workspace.dependencies]
# Internal workspace crates
pilimao-dsp = { path = "crates/pilimao-dsp" }
pilimao-decoder = { path = "crates/pilimao-decoder" }
pilimao-metadata = { path = "crates/pilimao-metadata" }
pilimao-playlist = { path = "crates/pilimao-playlist" }
pilimao-skin-wsz = { path = "crates/pilimao-skin-wsz" }
pilimao-audio-engine = { path = "crates/pilimao-audio-engine" }
pilimao-win32-shell = { path = "crates/pilimao-win32-shell" }

# Audio / DSP / Media
rubato = { version = "0.16", default-features = false, features = ["fft_resampler"] }
rustfft = "6.4"
symphonia = { version = "0.5", features = ["mp3", "flac", "ogg", "vorbis", "wav", "aac", "isomp4", "alac", "aiff", "pcm", "adpcm"] }
lofty = { version = "0.22", default-features = false, features = ["id3v2_compression_support"] }
rtrb = "0.3"
triple_buffer = "8.1"

# Search / Encoding / Skin
nucleo-matcher = "0.3"
encoding_rs = "0.8"
chardetng = "0.1"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }

# CLI / Errors
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"

# Windows native bindings
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
